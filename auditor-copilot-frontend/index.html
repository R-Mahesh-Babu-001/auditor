<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/esi-icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>AMY - Enterprise Auditor Copilot
    </title>
    <script>
      window.addEventListener('error', function(event) {
        console.error("Global captured error:", event);
        const errDiv = document.createElement('div');
        errDiv.style = "position:fixed;top:0;left:0;width:100%;background:#ef4444;color:white;padding:16px;z-index:999999;font-family:sans-serif;white-space:pre-wrap;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);";
        errDiv.innerHTML = "<strong>Error:</strong> " + event.message + "<br><small style='opacity:0.8;'>" + (event.filename || '') + ":" + (event.lineno || '') + "</small>";
        document.body.prepend(errDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
